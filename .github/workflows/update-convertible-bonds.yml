name: Update convertible bond snapshots

on:
  schedule:
    # Runs Monday-Friday at 08:20 UTC, 16:20 Asia/Shanghai, after A-share close.
    - cron: "20 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-convertible-bonds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy akshare

      - name: Fetch latest convertible bond snapshot
        env:
          JISILU_COOKIE: ${{ secrets.JISILU_COOKIE }}
        run: |
          python cb_multi_factor_selector.py --refresh --top 20
          python cb_factor_signal.py --capital 40000 --positions 10

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update convertible bond snapshot"
          file_pattern: data_cache/convertible_bonds/*.csv cb_factor_output/*.csv cb_factor_signal_output/*.csv
